name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests and package checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ncurses-bin python3

      - name: Run host-testable checks
        run: make ci

  build-tap:
    name: Build TAPs with z88dk
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile TAP files with z88dk
        run: |
          set -eu
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git_commit="${GITHUB_SHA::12}"
          docker run --rm -v "$PWD":/src -w /src \
            -e VERSION=ci \
            -e BUILD_DATE="$build_date" \
            -e GIT_COMMIT="$git_commit" \
            z88dk/z88dk:latest make tap if1
          mkdir -p dist
          cp build/term.tap dist/timex-vt100-emulator-ci.tap
          cp build/term-if1.tap dist/timex-vt100-emulator-ci-if1.tap
          ls -l dist

      - name: Upload TAP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timex-vt100-emulator-taps
          path: dist/*.tap
          if-no-files-found: error
